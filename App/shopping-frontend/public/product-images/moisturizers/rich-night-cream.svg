<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  
    <defs>
      <!-- Studio Lighting Background -->
      <linearGradient id="bgGrad_rich_night_cream" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F6F1EB" />
        <stop offset="60%" stop-color="#F6F1EB" />
        <stop offset="100%" stop-color="#E0D4C5" />
      </linearGradient>

      <!-- Radial Studio Ambient Light -->
      <radialGradient id="studioLight_rich_night_cream" cx="50%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0.04" />
      </radialGradient>

      <!-- Soft Ground Shadow -->
      <radialGradient id="groundShadow_rich_night_cream" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1A1816" stop-opacity="0.25" />
        <stop offset="50%" stop-color="#1A1816" stop-opacity="0.10" />
        <stop offset="100%" stop-color="#1A1816" stop-opacity="0" />
      </radialGradient>

      <!-- Packaging Body Gradient -->
      <linearGradient id="bodyGrad_rich_night_cream" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#241308" />
        <stop offset="15%" stop-color="#422817" />
        <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.6" />
        <stop offset="70%" stop-color="#422817" />
        <stop offset="100%" stop-color="#241308" />
      </linearGradient>

      <!-- Highlight Streak -->
      <linearGradient id="highlightGrad_rich_night_cream" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>

      <!-- Metallic / Accent Gradient -->
      <linearGradient id="metalGrad_rich_night_cream" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#BD8C55" stop-opacity="0.8" />
        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.7" />
        <stop offset="65%" stop-color="#BD8C55" />
        <stop offset="100%" stop-color="#BD8C55" stop-opacity="0.6" />
      </linearGradient>
    </defs>
  
  <!-- Studio Background Canvas -->
  <rect width="500" height="500" fill="url(#bgGrad_rich_night_cream)" />
  <rect width="500" height="500" fill="url(#studioLight_rich_night_cream)" />

  <!-- Subtle Studio Accent Glow -->
  <circle cx="250" cy="270" r="180" fill="#BD8C55" opacity="0.08" />

  <!-- Product Silhouette & Details -->
  
      <!-- Luxury Cream Jar Silhouette -->
      <!-- Ground Shadow -->
      <ellipse cx="250" cy="440" rx="120" ry="22" fill="url(#groundShadow_rich_night_cream)" />

      <!-- Jar Body -->
      <rect x="155" y="275" width="190" height="135" rx="16" fill="url(#bodyGrad_rich_night_cream)" />

      <!-- Specular Highlight Left & Right -->
      <rect x="168" y="285" width="10" height="115" rx="5" fill="url(#highlightGrad_rich_night_cream)" />
      <rect x="322" y="285" width="7" height="115" rx="3.5" fill="#FFFFFF" opacity="0.25" />

      <!-- Jar Neck / Thread -->
      <rect x="165" y="258" width="170" height="20" rx="4" fill="#1A1613" opacity="0.9" />

      <!-- Heavy Luxury Cap -->
      <rect x="150" y="200" width="200" height="65" rx="8" fill="#1A1613" />
      <!-- Cap Top Bevel -->
      <rect x="154" y="202" width="192" height="12" rx="4" fill="#FFFFFF" opacity="0.3" />
      <line x1="150" y1="240" x2="350" y2="240" stroke="#000000" stroke-width="1" opacity="0.15" />
      <line x1="150" y1="242" x2="350" y2="242" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3" />

      <!-- Cap Highlight -->
      <rect x="165" y="208" width="12" height="50" rx="4" fill="#FFFFFF" opacity="0.35" />

      <!-- Minimalist Front Label Band -->
      <g transform="translate(175, 295)">
        <rect x="0" y="0" width="150" height="95" rx="4" fill="#FFFDF9" stroke="#BD8C55" stroke-width="0.6" />
        <rect x="5" y="5" width="140" height="85" rx="2" fill="none" stroke="#BD8C55" stroke-width="0.4" stroke-dasharray="2,2" opacity="0.5" />

        <!-- Brand -->
        <text x="75" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" letter-spacing="4" fill="#241E19" text-anchor="middle">S O L E</text>
        <line x1="55" y1="33" x2="95" y2="33" stroke="#BD8C55" stroke-width="0.8" />

        <!-- Title -->
        <text x="75" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#2B2620" text-anchor="middle">RICH NIGHT CREAM</text>
        
        <!-- Subtitle -->
        <text x="75" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" font-weight="500" letter-spacing="0.8" fill="#BD8C55" text-anchor="middle">Nourishing Night Care Ritual</text>

        <!-- Spec -->
        <text x="75" y="82" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" letter-spacing="1" fill="#786F66" text-anchor="middle">50 ml • 1.7 fl. oz.</text>
      </g>
    
</svg>