<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  
    <defs>
      <!-- Studio Lighting Background -->
      <linearGradient id="bgGrad_daily_spf50_sunscreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FCF8ED" />
        <stop offset="60%" stop-color="#FCF8ED" />
        <stop offset="100%" stop-color="#EFE2C2" />
      </linearGradient>

      <!-- Radial Studio Ambient Light -->
      <radialGradient id="studioLight_daily_spf50_sunscreen" cx="50%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0.04" />
      </radialGradient>

      <!-- Soft Ground Shadow -->
      <radialGradient id="groundShadow_daily_spf50_sunscreen" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1A1816" stop-opacity="0.25" />
        <stop offset="50%" stop-color="#1A1816" stop-opacity="0.10" />
        <stop offset="100%" stop-color="#1A1816" stop-opacity="0" />
      </radialGradient>

      <!-- Packaging Body Gradient -->
      <linearGradient id="bodyGrad_daily_spf50_sunscreen" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#EBDDB7" />
        <stop offset="15%" stop-color="#FBF5E5" />
        <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.6" />
        <stop offset="70%" stop-color="#FBF5E5" />
        <stop offset="100%" stop-color="#EBDDB7" />
      </linearGradient>

      <!-- Highlight Streak -->
      <linearGradient id="highlightGrad_daily_spf50_sunscreen" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>

      <!-- Metallic / Accent Gradient -->
      <linearGradient id="metalGrad_daily_spf50_sunscreen" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#B58428" stop-opacity="0.8" />
        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.7" />
        <stop offset="65%" stop-color="#B58428" />
        <stop offset="100%" stop-color="#B58428" stop-opacity="0.6" />
      </linearGradient>
    </defs>
  
  <!-- Studio Background Canvas -->
  <rect width="500" height="500" fill="url(#bgGrad_daily_spf50_sunscreen)" />
  <rect width="500" height="500" fill="url(#studioLight_daily_spf50_sunscreen)" />

  <!-- Subtle Studio Accent Glow -->
  <circle cx="250" cy="270" r="180" fill="#B58428" opacity="0.08" />

  <!-- Product Silhouette & Details -->
  
      <!-- Cosmetic Squeeze Tube Silhouette -->
      <!-- Ground Shadow -->
      <ellipse cx="250" cy="445" rx="95" ry="18" fill="url(#groundShadow_daily_spf50_sunscreen)" />

      <!-- Inverted Stand-up Tube Base Cap -->
      <rect x="200" y="380" width="100" height="48" rx="6" fill="#D6AF5C" />
      <rect x="202" y="382" width="96" height="6" rx="2" fill="#FFFFFF" opacity="0.3" />
      <line x1="200" y1="400" x2="300" y2="400" stroke="#000000" stroke-width="0.8" opacity="0.15" />

      <!-- Tube Body (Tapers toward cap at bottom, crimped at top) -->
      <path d="M 175 140 L 325 140 L 295 382 L 205 382 Z" fill="url(#bodyGrad_daily_spf50_sunscreen)" />

      <!-- Top Crimped Seal Bar -->
      <rect x="173" y="128" width="154" height="14" rx="2" fill="#EBDDB7" />
      <!-- Crimp Ridges -->
      <line x1="180" y1="131" x2="180" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="190" y1="131" x2="190" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="200" y1="131" x2="200" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="210" y1="131" x2="210" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="220" y1="131" x2="220" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="230" y1="131" x2="230" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="240" y1="131" x2="240" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="250" y1="131" x2="250" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="260" y1="131" x2="260" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="270" y1="131" x2="270" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="280" y1="131" x2="280" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="290" y1="131" x2="290" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="300" y1="131" x2="300" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="310" y1="131" x2="310" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />
      <line x1="320" y1="131" x2="320" y2="139" stroke="#999" stroke-width="1" opacity="0.5" />

      <!-- Left Light Curved Highlight -->
      <path d="M 185 150 L 213 375" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.4" />
      <!-- Right Subtle Highlight -->
      <path d="M 315 150 L 288 375" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.2" />

      <!-- Direct Minimal Label on Tube -->
      <g transform="translate(190, 180)">
        <rect x="0" y="0" width="120" height="155" rx="3" fill="#FFFDF7" stroke="#B58428" stroke-width="0.6" />
        <rect x="4" y="4" width="112" height="147" rx="2" fill="none" stroke="#B58428" stroke-width="0.4" stroke-dasharray="2,2" opacity="0.5" />

        <!-- Brand -->
        <text x="60" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="4" fill="#241E19" text-anchor="middle">S O L E</text>
        <line x1="42" y1="38" x2="78" y2="38" stroke="#B58428" stroke-width="0.8" />

        <!-- Title -->
        <text x="60" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#2B2620" text-anchor="middle">DAILY SPF 50</text>
        
        <!-- Subtitle -->
        <text x="60" y="76" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="500" letter-spacing="0.7" fill="#B58428" text-anchor="middle">Broad Spectrum Concept</text>

        <!-- Sun Emblem / Cosmetic Crest -->
        <circle cx="60" cy="100" r="10" fill="none" stroke="#B58428" stroke-width="0.7" />
        <circle cx="60" cy="100" r="5" fill="#B58428" opacity="0.5" />
        
          <line x1="60" y1="86" x2="60" y2="89" stroke="#B58428" stroke-width="0.8" />
          <line x1="60" y1="111" x2="60" y2="114" stroke="#B58428" stroke-width="0.8" />
          <line x1="46" y1="100" x2="49" y2="100" stroke="#B58428" stroke-width="0.8" />
          <line x1="71" y1="100" x2="74" y2="100" stroke="#B58428" stroke-width="0.8" />
        

        <!-- Spec -->
        <text x="60" y="132" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" letter-spacing="1" fill="#786F66" text-anchor="middle">50 ml • 1.7 fl. oz.</text>
      </g>
    
</svg>