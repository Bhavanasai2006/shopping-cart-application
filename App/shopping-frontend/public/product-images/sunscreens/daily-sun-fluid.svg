<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  
    <defs>
      <!-- Studio Lighting Background -->
      <linearGradient id="bgGrad_daily_sun_fluid" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F9F6F0" />
        <stop offset="60%" stop-color="#F9F6F0" />
        <stop offset="100%" stop-color="#E7DDCA" />
      </linearGradient>

      <!-- Radial Studio Ambient Light -->
      <radialGradient id="studioLight_daily_sun_fluid" cx="50%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0.04" />
      </radialGradient>

      <!-- Soft Ground Shadow -->
      <radialGradient id="groundShadow_daily_sun_fluid" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1A1816" stop-opacity="0.25" />
        <stop offset="50%" stop-color="#1A1816" stop-opacity="0.10" />
        <stop offset="100%" stop-color="#1A1816" stop-opacity="0" />
      </radialGradient>

      <!-- Packaging Body Gradient -->
      <linearGradient id="bodyGrad_daily_sun_fluid" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#D9C6A7" />
        <stop offset="15%" stop-color="#F7EFE1" />
        <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.6" />
        <stop offset="70%" stop-color="#F7EFE1" />
        <stop offset="100%" stop-color="#D9C6A7" />
      </linearGradient>

      <!-- Highlight Streak -->
      <linearGradient id="highlightGrad_daily_sun_fluid" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>

      <!-- Metallic / Accent Gradient -->
      <linearGradient id="metalGrad_daily_sun_fluid" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8D6E46" stop-opacity="0.8" />
        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.7" />
        <stop offset="65%" stop-color="#8D6E46" />
        <stop offset="100%" stop-color="#8D6E46" stop-opacity="0.6" />
      </linearGradient>
    </defs>
  
  <!-- Studio Background Canvas -->
  <rect width="500" height="500" fill="url(#bgGrad_daily_sun_fluid)" />
  <rect width="500" height="500" fill="url(#studioLight_daily_sun_fluid)" />

  <!-- Subtle Studio Accent Glow -->
  <circle cx="250" cy="270" r="180" fill="#8D6E46" opacity="0.08" />

  <!-- Product Silhouette & Details -->
  
      <!-- Ergonomic Shake Sun Fluid Silhouette -->
      <!-- Ground Shadow -->
      <ellipse cx="250" cy="445" rx="90" ry="18" fill="url(#groundShadow_daily_sun_fluid)" />

      <!-- Bottle Body (Pebble-shaped curved silhouette) -->
      <path d="M 185 220 C 170 270 170 370 185 410 C 200 430 300 430 315 410 C 330 370 330 270 315 220 C 300 190 200 190 185 220 Z" fill="url(#bodyGrad_daily_sun_fluid)" />

      <!-- Specular Highlights -->
      <path d="M 195 230 C 185 270 185 360 195 395" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />
      <path d="M 305 230 C 315 270 315 360 305 395" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.2" />

      <!-- Precision Nozzle Cap -->
      <path d="M 230 195 L 270 195 L 265 140 L 235 140 Z" fill="#BBA17F" />
      <rect x="233" y="140" width="34" height="4" rx="2" fill="#FFFFFF" opacity="0.4" />
      <circle cx="250" cy="138" r="3" fill="#333" opacity="0.3" />

      <!-- Front Minimalist Brand Plaque -->
      <g transform="translate(192, 235)">
        <rect x="0" y="0" width="116" height="145" rx="4" fill="#FFFDF9" stroke="#8D6E46" stroke-width="0.6" />
        <rect x="4" y="4" width="108" height="137" rx="2" fill="none" stroke="#8D6E46" stroke-width="0.4" stroke-dasharray="2,2" opacity="0.5" />

        <!-- Brand -->
        <text x="58" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" letter-spacing="4" fill="#241E19" text-anchor="middle">S O L E</text>
        <line x1="40" y1="36" x2="76" y2="36" stroke="#8D6E46" stroke-width="0.8" />

        <!-- Title -->
        <text x="58" y="55" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#2B2620" text-anchor="middle">DAILY SUN FLUID</text>
        
        <!-- Subtitle -->
        <text x="58" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="500" letter-spacing="0.7" fill="#8D6E46" text-anchor="middle">Ultra-Light Shake Fluid</text>

        <!-- Shake Fluid Icon -->
        <circle cx="58" cy="94" r="8" fill="none" stroke="#8D6E46" stroke-width="0.7" />
        <path d="M 54 94 Q 58 90 62 94 Q 58 98 54 94" fill="#8D6E46" opacity="0.6" />

        <!-- Spec -->
        <text x="58" y="122" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" letter-spacing="1" fill="#786F66" text-anchor="middle">50 ml • 1.7 fl. oz.</text>
      </g>
    
</svg>